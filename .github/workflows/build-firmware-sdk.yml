name: 编译 ImmortalWrt NanoPi R1S-H3 固件与专属 SDK

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本分支'
        required: true
        type: choice
        options:
          - openwrt-24.10
          - openwrt-23.05
          - master
        default: 'openwrt-24.10'
      packages:
        description: '额外软件包 (空格分隔)'
        required: false
        type: string
        default: ''

jobs:
  build-firmware:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          path: immortalwrt-NanoPi-R1S-H3

      # ================================
      # 释放磁盘空间（保留必要目录）
      # ================================
      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo docker image prune -af || true

      # ================================
      # 安装编译依赖（不替换源）
      # ================================
      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential flex bison gawk gettext git \
            libncurses5-dev libssl-dev python3 python3-dev \
            python3-pip unzip wget zlib1g-dev file rsync \
            subversion swig libelf-dev time curl xz-utils

      # ================================
      # 克隆 ImmortalWrt 源码
      # ================================
      - name: 克隆 ImmortalWrt 源码
        run: |
          git clone --depth=1 --branch "${{ inputs.version }}" \
            https://github.com/immortalwrt/immortalwrt.git /tmp/immortalwrt

      # ================================
      # dl 缓存（极大提升稳定性）
      # ================================
      - name: 缓存 dl 目录
        uses: actions/cache@v4
        with:
          path: /tmp/immortalwrt/dl
          key: immortalwrt-dl-${{ inputs.version }}
          restore-keys: |
            immortalwrt-dl-

      # ================================
      # 复制编译脚本和 .config
      # ================================
      - name: 复制编译脚本和 .config
        run: |
          cp immortalwrt-NanoPi-R1S-H3/build.sh /tmp/immortalwrt/
          cp immortalwrt-NanoPi-R1S-H3/.config /tmp/immortalwrt/

      # ================================
      # 安装 DTS 文件（避免重复写入）
      # ================================
      - name: 安装 DTS 文件
        run: |
          TARGET_DIR=/tmp/immortalwrt bash immortalwrt-NanoPi-R1S-H3/patch-dts.sh

      # ================================
      # 运行编译（保留你的逻辑）
      # ================================
      - name: 运行编译
        run: |
          cd /tmp/immortalwrt
          chmod +x build.sh
          bash build.sh "${{ inputs.packages }}"

      # ================================
      # 上传固件（仅保存在 Actions 后台页面供下载，不发布 Release）
      # ================================
      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-nanopi-r1s-h3-${{ github.run_id }}
          path: /tmp/immortalwrt/bin/out/*
          retention-days: 7

  build-sdk:
    needs: build-firmware
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: feature/SDK

      - name: Prepare Workspace & Inject Config
        run: |
          # 克隆与固件任务一致的版本分支源码
          git clone -b "${{ inputs.version }}" https://github.com/immortalwrt/immortalwrt.git /tmp/immortalwrt
          
          # 精准挂载当前分支的私有配置文件与设备树
          cp -f .config /tmp/immortalwrt/.config
          if [ -d "dts" ]; then
              cp -rf dts/* /tmp/immortalwrt/target/linux/sunxi/files/ 2>/dev/null || true
          fi
          if [ -f "feeds.conf.default" ]; then
              cp -f feeds.conf.default /tmp/immortalwrt/feeds.conf.default
          fi

      - name: Execute Build Script for Environment & Toolchain
        run: |
          chmod +x build.sh
          # 运行 build.sh 完成全部环境准备、依赖安装、feeds更新与工具链构建
          ./build.sh

      - name: Compile and Package SDK
        run: |
          cd /tmp/immortalwrt
          
          echo "=== 触发 ImmortalWrt 原生 SDK 编译目标 ==="
          make target/compile -j$(nproc) || true
          make sdk/install -j$(nproc) || true
          
          mkdir -p /tmp/sdk_out
          for sdk_file in bin/downloads/openwrt-sdk-*.tar.xz bin/targets/sunxi/cortexa7/openwrt-sdk-*.tar.xz; do
              if [ -f "$sdk_file" ]; then
                  cp -f "$sdk_file" /tmp/sdk_out/
                  echo "已捕获专属 SDK 压缩包: $(basename "$sdk_file")"
              fi
          done
          
          # 备用防漏：若未直接生成独立归档，则手动打包核心编译资产
          if [ ! "$(ls -A /tmp/sdk_out)" ]; then
              echo "手动归档 SDK 核心工具链目录..."
              tar -cJvf /tmp/sdk_out/nanopi-r1s-h3-custom-sdk.tar.xz \
                  staging_dir/host \
                  staging_dir/target-arm_cortex-a7* \
                  tools \
                  toolchain \
                  Makefile \
                  rules.mk \
                  include \
                  scripts
          fi

      - name: Upload SDK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nanopi-r1s-h3-custom-sdk
          path: /tmp/sdk_out/*
          retention-days: 7
