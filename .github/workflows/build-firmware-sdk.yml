name: '[1] 编译 NanoPi R1S-H3 (固件 + SDK 双重产物)'

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本分支'
        required: true
        type: choice
        options:
          - openwrt-24.10
          - openwrt-23.05
          - master
        default: 'openwrt-24.10'
      packages:
        description: '额外软件包 (空格分隔)'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false

    steps:
      - name: 检出定制仓库 (feature/SDK)
        uses: actions/checkout@v4
        with:
          ref: feature/SDK

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo docker image prune -af || true

      - name: 安装系统编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential flex bison gawk gettext git \
            libncurses5-dev libssl-dev python3 python3-dev \
            python3-pip unzip wget zlib1g-dev file rsync \
            subversion swig libelf-dev time curl xz-utils

      - name: 克隆官方 ImmortalWrt 源码
        run: |
          git clone --depth=1 --branch "${{ inputs.version }}" \
            https://github.com/immortalwrt/immortalwrt.git /tmp/immortalwrt

      - name: 缓存 dl 目录加速编译
        uses: actions/cache@v4
        with:
          path: /tmp/immortalwrt/dl
          key: immortalwrt-dl-${{ inputs.version }}-${{ hashFiles('feeds.conf.default') }}
          restore-keys: |
            immortalwrt-dl-${{ inputs.version }}-
            immortalwrt-dl-

      - name: 对齐硬件资产并交由主脚本构建
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          # 严格对齐仓库树结构，将资产与总控脚本整体拷贝到编译根目录
          cp -f ${GITHUB_WORKSPACE}/build.sh /tmp/immortalwrt/build.sh
          cp -f ${GITHUB_WORKSPACE}/patch-dts.sh /tmp/immortalwrt/patch-dts.sh
          cp -f ${GITHUB_WORKSPACE}/.config /tmp/immortalwrt/.config
          cp -r ${GITHUB_WORKSPACE}/dts /tmp/immortalwrt/dts
          [ -f "${GITHUB_WORKSPACE}/feeds.conf.default" ] && cp -f ${GITHUB_WORKSPACE}/feeds.conf.default /tmp/immortalwrt/feeds.conf.default

          # 进入编译目录执行总控脚本
          cd /tmp/immortalwrt
          chmod +x build.sh patch-dts.sh
          bash build.sh "${{ inputs.packages }}"

      - name: 上传全量固件、rootfs 与 SDK 产物
        uses: actions/upload-artifact@v4
        with:
          name: nanopi-r1s-h3-complete-artifacts-${{ github.run_id }}
          path: /tmp/immortalwrt/bin/out/*
          retention-days: 14
