name: 编译 ImmortalWrt NanoPi R1S-H3

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本分支'
        required: true
        type: choice
        options:
          - openwrt-24.10
          - openwrt-23.05
          - master
        default: 'openwrt-24.10'
      packages:
        description: '额外软件包 (空格分隔)'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          path: immortalwrt-Quake

      # ================================
      # 释放磁盘空间（保留必要目录）
      # ================================
      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo docker image prune -af || true

      # ================================
      # 安装编译依赖（不替换源）
      # ================================
      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential flex bison gawk gettext git \
            libncurses5-dev libssl-dev python3 python3-dev \
            python3-pip unzip wget zlib1g-dev file rsync \
            subversion swig libelf-dev time curl xz-utils

      # ================================
      # 克隆 ImmortalWrt 源码
      # ================================
      - name: 克隆 ImmortalWrt 源码
        run: |
          git clone --depth=1 --branch "${{ inputs.version }}" \
            https://github.com/immortalwrt/immortalwrt.git /tmp/immortalwrt

      # ================================
      # dl 缓存（极大提升稳定性）
      # ================================
      - name: 缓存 dl 目录
        uses: actions/cache@v4
        with:
          path: /tmp/immortalwrt/dl
          key: immortalwrt-dl-${{ inputs.version }}
          restore-keys: |
            immortalwrt-dl-

      # ================================
      # 复制编译脚本和 .config
      # ================================
      - name: 复制编译脚本和 .config
        run: |
          cp immortalwrt-Quake/build.sh /tmp/immortalwrt/
          cp immortalwrt-Quake/.config /tmp/immortalwrt/

      # ================================
      # 安装 DTS 文件（避免重复写入）
      # ================================
      - name: 安装 DTS 文件
        run: |
          TARGET_DIR=/tmp/immortalwrt bash immortalwrt-Quake/patch-dts.sh

      # ================================
      # 运行编译（保留你的逻辑）
      # ================================
      - name: 运行编译
        run: |
          cd /tmp/immortalwrt
          chmod +x build.sh
          bash build.sh "${{ inputs.packages }}"

      # ================================
      # 上传固件
      # ================================
      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-nanopi-r1s-h3-${{ github.run_id }}
          path: /tmp/immortalwrt/bin/out/*
          retention-days: 7

      # ================================
      # 创建 Release
      # ================================
      - name: 创建 Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_id }}
          name: ImmortalWrt NanoPi R1S-H3 - ${{ github.run_id }}
          files: /tmp/immortalwrt/bin/out/*
          body: |
            ## 编译信息
            - **分支**: `${{ inputs.version }}`
            - **日期**: $(date +%Y-%m-%d)
            - **运行 ID**: ${{ github.run_id }}
            - **额外软件包**: ${{ inputs.packages }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}