name: Build ImmortalWrt NanoPi R1S-H3

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release build'
        default: 'false'
        type: boolean

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: 检出轻量资产仓库
        uses: actions/checkout@v4

      - name: 初始化编译系统依赖
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com|https://mirrors.tuna.tsinghua.edu.cn|g' /etc/apt/sources.list
          sudo sed -i 's|http://archive.ubuntu.com|https://mirrors.tuna.tsinghua.edu.cn|g' /etc/apt/sources.list
          sudo sed -i 's|https://archive.ubuntu.com|https://mirrors.tuna.tsinghua.edu.cn|g' /etc/apt/sources.list
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libfuse-dev libncurses5-dev \
          libssl-dev python3 python3-dev python3-pip python3-setuptools \
          rsync unzip zlib1g-dev file wget subversion patch upx-ucl \
          autoconf automake libtool

      - name: 动态克隆官方 ImmortalWrt 源码
        run: |
          git clone --depth 1 https://github.com/immortalwrt/immortalwrt.git -b openwrt-24.10 /tmp/immortalwrt

      - name: 注入配置与硬件 DTS 资产
        run: |
          # 1. 复制 feeds 配置与 .config 到源码目录
          cp -f feeds.conf.default /tmp/immortalwrt/
          cp -f .config /tmp/immortalwrt/
          
          # 2. 复制 dts 文件夹到工作区
          cp -r dts /tmp/immortalwrt/
          
          # 3. 复制并执行 patch-dts.sh 注入内核与 Makefile
          cp -f patch-dts.sh /tmp/immortalwrt/
          chmod +x /tmp/immortalwrt/patch-dts.sh
          cd /tmp/immortalwrt
          TARGET_DIR="/tmp/immortalwrt" ./patch-dts.sh

      - name: 更新 Feeds 与生成配置
        run: |
          cd /tmp/immortalwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -f -a
          make defconfig

      - name: 执行核心编译脚本
        run: |
          # 复制 build.sh 到源码目录并执行
          cp -f build.sh /tmp/immortalwrt/
          chmod +x /tmp/immortalwrt/build.sh
          cd /tmp/immortalwrt
          ./build.sh

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-nanopi-r1s-h3-firmware
          path: /tmp/immortalwrt/bin/out/*
