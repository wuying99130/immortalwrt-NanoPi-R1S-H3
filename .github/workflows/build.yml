name: 编译 ImmortalWrt NanoPi R1S-H3

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本分支'
        required: true
        type: choice
        options:
          - openwrt-24.10
          - openwrt-23.05
          - master
        default: 'openwrt-24.10'
      packages:
        description: '额外软件包 (空格分隔)'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          path: immortalwrt-NanoPi-R1S-H3

      # ================================
      # 释放磁盘空间（保留必要目录）
      # ================================
      - name: 释放磁盘空间
        run: |
          sudo sed -i 's|http://ubuntu.com|https://tsinghua.edu.cn|g' /etc/apt/sources.list
          sudo sed -i 's|http://ubuntu.com|https://tsinghua.edu.cn|g' /etc/apt/sources.list
          sudo sed -i 's|https://ubuntu.com|https://tsinghua.edu.cn|g' /etc/apt/sources.list
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libfuse-dev libncurses5-dev \
          libssl-dev python3 python3-dev python3-pip python3-setuptools \
          rsync unzip zlib1g-dev file wget subversion patch upx-ucl \
          autoconf automake libtool

      - name: 动态克隆官方 ImmortalWrt 源码
        run: |
          git clone --depth 1 https://github.com -b openwrt-24.10 /tmp/immortalwrt

      - name: 优先更新 Feeds 源与安装第三方插件
        run: |
          cd /tmp/immortalwrt
          # 1. 先把自定义的 feeds.conf.default 拷贝过去
          cp -f ${GITHUB_WORKSPACE}/feeds.conf.default ./
          
          # 2. 立即更新并安装所有官方及第三方源
          ./scripts/feeds update -a
          ./scripts/feeds install -f -a

      # ============================================================
      # 🚀【官方凭证护航】直接在外部安全下载第三方插件，彻底解决 128 报错
      # ============================================================
      - name: 下载 Passwall 依赖组件包
        uses: actions/checkout@v4
        with:
          repository: 'xiaorouji/openwrt-passwall-packages'
          ref: 'main'
          path: '/tmp/immortalwrt/package/custom-plugins/openwrt-passwall-packages'
          token: ${{ secrets.MY_GIT_TOKEN }}

      - name: 下载 luci-app-sing-box 插件
        uses: actions/checkout@v4
        with:
          repository: 'sbwdl/luci-app-sing-box'
          path: '/tmp/immortalwrt/package/custom-plugins/luci-app-sing-box'
          token: ${{ secrets.MY_GIT_TOKEN }}

      - name: 注入 .config 配置与硬件 DTS 资产
        run: |
          cd /tmp/immortalwrt
          # 3. 确保第三方源码已经就位后，再放入锁定了 =y 的 .config
          cp -f ${GITHUB_WORKSPACE}/.config ./
          
          # 4. 拷贝并运行 DTS 补丁
          cp -r ${GITHUB_WORKSPACE}/dts ./
          cp -f ${GITHUB_WORKSPACE}/patch-dts.sh ./
          chmod +x patch-dts.sh
          TARGET_DIR="/tmp/immortalwrt" ./patch-dts.sh
          
          # 5. 最后生成最终配置
          make defconfig

      - name: 执行核心编译脚本
        run: |
          cd /tmp/immortalwrt
          # 复制 build.sh 到源码目录并执行
          cp -f ${GITHUB_WORKSPACE}/build.sh ./
          chmod +x ./build.sh
          ./build.sh

      # ================================
      # 上传固件
      # ================================
      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-nanopi-r1s-h3-${{ github.run_id }}
          path: /tmp/immortalwrt/bin/out/*
